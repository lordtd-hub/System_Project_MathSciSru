services:
  postgres:
    image: postgres:16
    container_name: project_assessment_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: project_assessment
    ports:
      - "5432:5432"
    volumes:
      - project_assessment_pgdata:/var/lib/postgresql/data

volumes:
  project_assessment_pgdata:
